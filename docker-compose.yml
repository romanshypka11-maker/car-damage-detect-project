version: '3.8'

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
    ports:
      - "8191:8191"
    restart: unless-stopped

  api_server:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      - PYTHONPATH=/app
      - IS_DOCKER=true
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - .:/app
      - ./models_ML:/app/models_ML
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    depends_on:
      - api_server
      - flaresolverr
    environment:
      - IS_DOCKER=true
      - AI_SERVICE_URL=http://api_server:8000
      - BOT_TOKEN=${BOT_TOKEN}
      - PYTHONPATH=/app
    volumes:
      - .:/app
    restart: unless-stopped